<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema de Escalas — Trousseau</title>
<style>
:root{
  --db:#1F3864;--mb:#2E75B6;--lb:#BDD7EE;--gn:#375623;--gnb:#E2EFDA;
  --or:#FF6B35;--orb:#FFF2CC;--red:#C0392B;--dom:#FFDDC1;--sab:#CCE5FF;--fer:#FFE699;
  --bg:#F4F6F9;--card:#fff;--border:#DEE2E6;--sub:#6C757D;--radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:#212529;min-height:100vh}
#app{display:flex;flex-direction:column;min-height:100vh}
header{background:var(--db);color:#fff;padding:0 20px;height:54px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.3);position:sticky;top:0;z-index:100}
header h1{font-size:16px;font-weight:700;flex:1}
.nav-pills{display:flex;gap:3px}
.nav-pill{padding:5px 12px;border-radius:18px;border:1.5px solid rgba(255,255,255,.3);color:#fff;cursor:pointer;font-size:12px;font-weight:500;background:transparent;transition:.2s;white-space:nowrap}
.nav-pill:hover{background:rgba(255,255,255,.15)}
.nav-pill.active{background:#fff;color:var(--db);border-color:#fff}
main{flex:1;padding:20px;max-width:1400px;margin:0 auto;width:100%}
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 2px 12px rgba(0,0,0,.08);padding:18px;margin-bottom:16px}
.card-title{font-size:14px;font-weight:700;color:var(--db);margin-bottom:14px}
select,input[type=text],input[type=number]{border:1.5px solid var(--border);border-radius:7px;padding:7px 11px;font-size:13px;color:#212529;background:#fff;width:100%;transition:.2s}
select:focus,input:focus{outline:none;border-color:var(--mb)}
label{font-size:11px;font-weight:600;color:var(--sub);display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.form-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.form-group{flex:1;min-width:140px}
.btn{padding:8px 16px;border-radius:7px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn-primary{background:var(--mb);color:#fff}.btn-primary:hover{background:var(--db)}
.btn-success{background:var(--gn);color:#fff}.btn-success:hover{background:#2d4a1e}
.btn-danger{background:var(--red);color:#fff}
.btn-outline{background:transparent;border:1.5px solid var(--mb);color:var(--mb)}.btn-outline:hover{background:var(--lb)}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-warn{background:#FF6B35;color:#fff}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.08);border-left:4px solid var(--mb)}
.kpi-label{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--sub);letter-spacing:.5px;margin-bottom:5px}
.kpi-value{font-size:24px;font-weight:800;color:var(--db)}
.kpi-sub{font-size:10px;color:var(--sub);margin-top:2px}
.data-table{width:100%;border-collapse:collapse;font-size:12px}
.data-table th{background:var(--db);color:#fff;padding:8px 10px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.data-table td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.data-table tr:hover td{background:#F8F9FA}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700}
.badge-green{background:var(--gnb);color:var(--gn)}.badge-orange{background:var(--orb);color:#7F6000}
.alert{padding:10px 14px;border-radius:7px;font-size:12px;margin-bottom:14px;display:flex;align-items:center;gap:7px}
.alert-info{background:var(--lb);color:var(--db);border:1px solid #BDD7EE}
.alert-success{background:var(--gnb);color:var(--gn);border:1px solid #C6E1C6}
.alert-error{background:#FDECEA;color:var(--red);border:1px solid #F5C6CB}
.alert-warn{background:var(--orb);color:#7F6000;border:1px solid #FFE699}
.loading{text-align:center;padding:40px;color:var(--sub);font-size:13px}
.loading-spinner{width:32px;height:32px;border:3px solid var(--lb);border-top-color:var(--mb);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px;color:var(--sub)}
.empty-icon{font-size:40px;margin-bottom:10px}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:var(--radius);max-width:500px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-header{padding:18px 20px 0;display:flex;justify-content:space-between;align-items:center}
.modal-header h3{font-size:16px;font-weight:700;color:var(--db)}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--sub)}
.modal-body{padding:18px 20px}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}

/* ESCALA */
.escala-wrap{overflow-x:auto}
.escala-table{border-collapse:collapse;font-size:11px}
.escala-table th,.escala-table td{border:1px solid #ddd;text-align:center;padding:0}
.col-nome{text-align:left!important;padding:5px 8px!important;font-weight:600;font-size:11px;min-width:170px;white-space:nowrap;color:var(--db)}
.col-func{padding:4px!important;font-size:10px;color:var(--sub);min-width:70px}
.day-header{background:var(--mb);color:#fff;font-weight:700;font-size:10px;width:26px;min-width:26px;padding:3px 1px}
.day-header.dom{background:#C0392B}.day-header.sab{background:#1565C0}.day-header.fer{background:var(--or)}
.wd-row th{font-size:8px;color:var(--sub);padding:2px;background:#f8f9fa}
.day-cell{width:26px;height:26px;cursor:pointer;font-size:10px;font-weight:700;position:relative;user-select:none;transition:.1s}
.day-cell:hover{filter:brightness(.9)}
.day-cell.inactive{background:#EEE!important;cursor:default;pointer-events:none}
.day-cell.bg-dom{background:var(--dom)}.day-cell.bg-sab{background:var(--sab)}.day-cell.bg-fer{background:var(--fer)}
.day-cell.val-X{background:#27AE60;color:#fff}.day-cell.val-D{background:#E74C3C;color:#fff}
.day-cell.val-S{background:#2980B9;color:#fff}.day-cell.val-F{background:#FF6B35;color:#fff}
.day-cell.val-FOL{background:#95A5A6;color:#fff;font-size:8px}
.sum-qtd{background:var(--gnb);color:var(--gn);font-weight:700;font-size:11px;padding:4px 5px}
.sum-fer{background:var(--orb);color:#7F6000;font-weight:700;font-size:11px;padding:4px 5px}
.sum-total{background:var(--db);color:#fff;font-weight:700;font-size:11px;padding:4px 6px;min-width:68px}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px}
.legend-dot{width:18px;height:18px;border-radius:3px;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#fff}

/* POPUP */
.day-popup{position:fixed;z-index:9999;background:#fff;border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.22);padding:7px;display:flex;flex-direction:column;gap:3px;min-width:148px;animation:popIn .12s ease}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.day-popup-header{font-size:10px;font-weight:700;color:var(--sub);padding:2px 5px 5px;border-bottom:1px solid #eee;margin-bottom:2px;text-transform:uppercase;letter-spacing:.5px}
.day-popup-btn{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;border:none;background:#f8f9fa;cursor:pointer;font-size:12px;font-weight:600;text-align:left;transition:.12s;width:100%}
.day-popup-btn:hover{filter:brightness(.93)}
.day-popup-btn .pip{width:24px;height:24px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;flex-shrink:0}
.day-popup-btn.clear .pip{background:#dee2e6;color:#6C757D}

/* SETUP */
.setup-screen{display:flex;align-items:center;justify-content:center;min-height:80vh}
.setup-card{background:#fff;border-radius:14px;box-shadow:0 4px 24px rgba(0,0,0,.12);padding:36px;max-width:560px;width:100%;text-align:center}
.setup-step{background:#F4F6F9;border-radius:8px;padding:14px 16px;margin-bottom:10px;text-align:left;font-size:13px}
.setup-step strong{color:var(--db)}
.step-num{display:inline-block;width:22px;height:22px;background:var(--mb);color:#fff;border-radius:50%;font-size:11px;font-weight:700;text-align:center;line-height:22px;margin-right:6px;flex-shrink:0}

@media(max-width:768px){
  header{padding:0 12px}
  .nav-pills{gap:2px}
  .nav-pill{padding:4px 8px;font-size:11px}
  main{padding:12px}
  .form-row{flex-direction:column;gap:8px}
}
</style>
</head>

function calcEaster(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),dy=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,dy);}

// Mapa filial → cidade para feriados municipais
const FILIAL_CIDADE={
  BV:'PORTO_FELIZ', BSB:'DF',
  SP_CATARINA:'SAO_ROQUE', SP_CIDADE_JARDIM:'SP', SP_GABRIEL_MONTEIRO:'SP',
  SP_HIGIENOPOLIS:'SP', SP_IGT:'SP', SP_ITUPEVA:'ITUPEVA',
  SP_JOAO_CACHOEIRA:'SP', SP_VNC:'SP',
  BH_BHB:'BH', BH_BHL:'BH', BH_BHP:'BH', BH_BHS:'BH',
  RJ_RJA:'ANGRA', RJ_RJB:'RJ', RJ_RJG:'RJ', RJ_RJL:'RJ', RJ_RJV:'RJ',
};

function buildHolidays(y, cidade='SP'){
  // Verifica se há feriados customizados no localStorage
  const custom = getFeriadosCustom ? getFeriadosCustom() : null;

  const e=calcEaster(y), h={};
  const add=(m,d)=>{ h[`${m}-${d}`]=1; };
  const addD=dt=>{ add(dt.getMonth()+1,dt.getDate()); };
  const off=(dt,days)=>{ const d2=new Date(dt); d2.setDate(d2.getDate()+days); return d2; };

  // Feriados móveis (sempre automáticos)
  addD(off(e,-48)); addD(off(e,-47)); addD(off(e,-2)); addD(e); addD(off(e,60));

  // Feriados fixos federais — usa custom se existir
  const federais = (custom && custom['FEDERAIS']) ? custom['FEDERAIS'] : FERIADOS_PADRAO.FEDERAIS;
  for(const f of federais) add(f.m, f.d);

  // Feriados da cidade — usa custom se existir
  const extras = (custom && custom[cidade]) ? custom[cidade] : (FERIADOS_PADRAO[cidade]||[]);
  for(const f of extras) add(f.m, f.d);

  return h;
}

function chave(fid,yr,mo,empId){return `${fid}__${yr}__${mo}__${empId}`;}
function calcTotal(dias, rates){
  let qtdX=0,qtdS=0,qtdD=0,qtdF=0;
  Object.values(dias).forEach(v=>{
    const u=(v||'').toUpperCase();
    if(u==='X') qtdX++;
    else if(u==='S') qtdS++;
    else if(u==='D') qtdD++;
    else if(u==='F') qtdF++;
  });
  const rateX = rates.rateX||rates.rateD||0;
  const rateS = rates.rateS||rates.rateD||0;
  const rateD = rates.rateD||0;
  const rateF = rates.rateF||0;
  const total = rates.fixo + qtdX*rateX + qtdS*rateS + qtdD*rateD + qtdF*rateF;
  return {qtd:qtdX+qtdS+qtdD, qtdX, qtdS, qtdD, qtdF, total};
}
function getDias(fid,yr,mo,empId){return(escalaLocal[chave(fid,yr,mo,empId)]||{}).dias||{};}

// Retorna as taxas corretas para um funcionário num mês/ano específico
// Respeita o histórico de vigências
// Afastado o mês inteiro: não recebe VR (nem o valor fixo)
function afastadoMesInteiro(emp, yr, mo){
  if(!emp || !emp.aft_ini) return false;
  const ini=`${yr}-${String(mo).padStart(2,'0')}-01`;
  const fim=`${yr}-${String(mo).padStart(2,'0')}-${String(new Date(yr,mo,0).getDate()).padStart(2,'0')}`;
  return emp.aft_ini <= ini && (!emp.aft_fim || emp.aft_fim >= fim);
}
function getRates(emp, yr, mo){
  if(afastadoMesInteiro(emp, yr, mo)) return {rateX:0,rateD:0,rateS:0,rateF:0,fixo:0};
  const hist = emp.rate_historico;
  const fixo = emp.rate_fixo||0;
  // estoquista_loja tem rate_x (dia), rate_d (domingo) e rate_f (feriado) separados
  const isEL  = emp.tipo==='estoquista_loja';
  const isRJE = emp.tipo==='rj_estoquista';
  const baseRates = {
    rateX: emp.rate_x||0,
    rateD: emp.rate_d||((isEL||isRJE)?0:emp.rate_x)||0,
    rateS: emp.rate_sdf||emp.rate_d||0,  // sábado RJ estoquista
    rateF: emp.rate_f||0,
    fixo
  };
  if(!hist || !hist.length) return baseRates;
  const yrmo = yr*100+mo;
  for(const h of hist){
    const ini = h.de_yr*100+h.de_mo;
    const fim = h.ate_yr*100+h.ate_mo;
    if(yrmo >= ini && yrmo < fim){
      return { rateX: h.rate_x||baseRates.rateX, rateD: h.rate_d||0, rateF: h.rate_f||0, fixo: h.rate_fixo||fixo };
    }
  }
  return baseRates;
}

  angra:       [{v:'X',l:'Dia trabalhado',bg:'#27AE60'},{v:'F',l:'Feriado',bg:'#FF6B35'},{v:'FOL',l:'Folga',bg:'#95A5A6'}],

};
let _popup=null;
function openPicker(cell,tipo,dia,wdName,fid,empId,yr,mo){
  closePopup();
  const opts=OPCOES[tipo]||OPCOES.mensalista;
  const rect=cell.getBoundingClientRect();
  const popup=document.createElement('div');
  popup.className='day-popup';popup.id='_daypopup';
  popup.innerHTML=`<div class="day-popup-header">Dia ${dia} — ${wdName}</div>
    ${opts.map(o=>`<button class="day-popup-btn" onclick="pickDay('${o.v}','${fid}','${empId}',${yr},${mo},${dia})">
      <span class="pip" style="background:${o.bg}">${o.v}</span>${o.l}</button>`).join('')}
    <button class="day-popup-btn clear" onclick="pickDay('','${fid}','${empId}',${yr},${mo},${dia})">
      <span class="pip" style="background:#dee2e6;color:#6C757D">—</span>Limpar</button>`;
  const top=Math.min(rect.bottom+4,window.innerHeight-280);
  const left=Math.min(rect.left,window.innerWidth-165);
  popup.style.top=top+'px';popup.style.left=left+'px';
  document.body.appendChild(popup);_popup={popup,cell};
  setTimeout(()=>document.addEventListener('click',_outClick,{once:true}),0);
}
function _outClick(e){if(_popup&&!_popup.popup.contains(e.target))closePopup();}
function closePopup(){const p=document.getElementById('_daypopup');if(p)p.remove();_popup=null;}
function pickDay(val,fid,empId,yr,mo,dia){
  closePopup();
  const k=chave(fid,yr,mo,empId);
  if(!escalaLocal[k])escalaLocal[k]={dias:{}};
  if(val)escalaLocal[k].dias[dia]=val;
  else delete escalaLocal[k].dias[dia];
  // Recalc
  const emps=getFuncs(fid)||[];
  const emp=emps.find(e=>e.id===empId);
  if(emp){
    const dias=escalaLocal[k].dias;
    const rates=getRates(emp,yr,mo);
    const calc=calcTotal(dias,rates);
    escalaLocal[k].qtd=calc.qtd;
    escalaLocal[k].qtdF=calc.qtdF;
    escalaLocal[k].total=calc.total;
  }
  salvarLocal();
  marcarPendente(fid,yr,mo,empId);
  agendarEnvio(fid,yr,mo);
  // Atualiza célula e totais sem rerenderizar tudo
  const cell=document.getElementById(`dc_${fid}_${empId}_${dia}`);
  if(cell){
    cell.className='day-cell '+getDayBg(fid,yr,mo,dia)+(val?` val-${val}`:'');
    cell.textContent=val||'';
  }
  updateRowTotals(fid,empId,yr,mo);
}
function getDayBg(fid,yr,mo,d){
  const hol=getHol(yr,fid);const wd=weekday(yr,mo,d);
  return hol[`${mo}-${d}`]?'bg-fer':wd===0?'bg-dom':wd===6?'bg-sab':'';
}
function updateRowTotals(fid,empId,yr,mo){
  const k=chave(fid,yr,mo,empId);
  const d=escalaLocal[k]||{};
  // Recalcula sempre com rates atuais
  const emp=getFuncs(fid).find(e=>e.id===empId);
  let qtd=d.qtd||0, qtdF=d.qtdF||0, total=d.total||0;
  if(emp){
    const rates=getRates(emp,yr,mo);
    const calc=calcTotal(d.dias||{},rates);
    qtd=calc.qtd; qtdF=calc.qtdF; total=calc.total;
    // Salva o total recalculado
    if(escalaLocal[k]){ escalaLocal[k].total=total; escalaLocal[k].qtd=qtd; escalaLocal[k].qtdF=qtdF; }
  }
  const eqEl=document.getElementById(`eq_${empId}`);if(eqEl)eqEl.textContent=qtd||'';
  const efEl=document.getElementById(`ef_${empId}`);if(efEl)efEl.textContent=qtdF||'';
  const etEl=document.getElementById(`et_${empId}`);if(etEl)etEl.textContent=total?'R$'+total.toFixed(2):'';
}

function renderGrade(){
  const fid=currentFilial,yr=currentYear,mo=currentMonth;
  _renderGradeInternal(fid,yr,mo);
}
function _renderGradeInternal(fid,yr,mo){
  const emps=getFuncsAtivos(fid,yr,mo)||[];
  const hol=getHol(yr,fid);const dc=daysInMonth(yr,mo);
  const wrap=document.getElementById('grade-wrap');
  if(!wrap)return;
  if(!emps.length){wrap.innerHTML='<div class="empty"><div class="empty-icon">👥</div><p>Sem funcionários.</p></div>';return;}

  // Legenda dinâmica
  const tipos=new Set(emps.map(e=>e.tipo));
  const temX=true;
  const temD=[...tipos].some(t=>['vendedora','rj_vendedora','rj_staff','misto'].includes(t));
  const temS=[...tipos].some(t=>['rj_vendedora','rj_staff'].includes(t));
  const isRJ=fid.startsWith('RJ_');
  const dot=(v,bg,l)=>`<div class="legend-item"><div class="legend-dot" style="background:${bg}">${v}</div>${l}</div>`;
  const box=(bg,l)=>`<div class="legend-item"><div style="width:18px;height:18px;background:${bg};border:1px solid #ddd;border-radius:3px"></div>${l}</div>`;
  const leg=document.getElementById('escala-legend');
  if(leg)leg.innerHTML=
    dot('X','#27AE60','Dia trabalhado')+
    (temD?dot('D','#E74C3C','Domingo'):'')+
    (isRJ&&temS?dot('S','#2980B9','Sábado (RJ)'):'')+
    dot('F','#FF6B35','Feriado trabalhado')+
    dot('FOL','#95A5A6','Folga')+
    (temD?box('var(--dom)','Domingo'):'')+(isRJ&&temS?box('var(--sab)','Sábado'):'')+
    box('var(--fer)','Feriado (fundo)');

  // Header dias
  let thDias='',thWd='';
  for(let d=1;d<=31;d++){
    if(d>dc){thDias+=`<th class="day-header" style="background:#DDD"></th>`;thWd+=`<th></th>`;continue;}
    const wd=weekday(yr,mo,d),isH=hol[`${mo}-${d}`];
    const cls=isH?'fer':wd===0?'dom':wd===6?'sab':'';
    const wdn=DAYS_PT[wd===0?6:wd-1];
    thDias+=`<th class="day-header ${cls}">${d}</th>`;
    thWd+=`<th style="font-size:8px;padding:2px;background:${isH?'var(--fer)':wd===0?'var(--dom)':wd===6?'var(--sab)':'#f8f9fa'};color:${isH?'#7F6000':wd===0?'#8B0000':wd===6?'#1A5276':'#666'};border:1px solid #ddd">${isH?'fer':wdn}</th>`;
  }

  let rows='';
  for(const e of emps){
    const dias=getDias(fid,yr,mo,e.id);
    const rates=getRates(e,yr,mo);
    const calc=calcTotal(dias,rates);
    const qtd=calc.qtd, qtdF=calc.qtdF, total=calc.total;
    rows+=`<tr>
      <td class="col-nome">${e.nome}</td>
      <td class="col-func">${e.funcao}</td>`;
    for(let d=1;d<=31;d++){
      if(d>dc){rows+=`<td class="day-cell inactive"></td>`;continue;}
      const val=(dias[d]||'').toUpperCase();
      const bg=getDayBg(fid,yr,mo,d);
      const wd=weekday(yr,mo,d);const wdn=DAYS_PT[wd===0?6:wd-1];
      rows+=`<td id="dc_${fid}_${e.id}_${d}" class="day-cell ${bg}${val?' val-'+val:''}" onclick="openPicker(this,'${e.tipo}',${d},'${wdn}','${fid}','${e.id}',${yr},${mo})">${val}</td>`;
    }
    rows+=`<td class="sum-qtd" id="eq_${e.id}">${qtd||''}</td>
      <td class="sum-fer" id="ef_${e.id}">${qtdF||''}</td>
      <td class="sum-total" id="et_${e.id}">R$${total.toFixed(2)}</td>
    </tr>`;
  }
  // auto sync removed
  wrap.innerHTML=`<table class="escala-table">
    <thead>
      <tr><th class="col-nome" rowspan="2">FUNCIONÁRIO</th><th class="col-func" rowspan="2">FUNÇÃO</th>${thDias}<th class="day-header" style="background:var(--gn)">Qtd</th><th class="day-header" style="background:#FF6B35">Fer</th><th class="day-header" style="background:var(--db);min-width:68px">Total R$</th></tr>
      <tr>${thWd}<th></th><th></th><th></th></tr>
    </thead>
    <tbody>${rows}</tbody>
  </table>`;
}

async function exportCSV(){

      const dias=getDias(fid,yr,mo,e.id);
      let qtd=0,qtdF=0;

      csv+=`669345550001-19;${e.nome};${e.cpf||''};${e.email||''};${e.tel||''};${FILIAIS[fid].label};${total.toFixed(2).replace('.',',')}\n`;
    }
  }
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`PedidoVR_${MONTHS[mo-1]}_${yr}.csv`;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1000);
  showAlert('CSV exportado com sucesso!');
}

        <select onchange="currentFilial=this.value;pgHistorico()">

        </select></div>`:''}
      <div class="form-group" style="max-width:115px"><label>Ano</label>
        <select onchange="currentYear=+this.value;if(currentYear===2026&&currentMonth<11)currentMonth=11;pgHistorico()">
          ${[2026,2027,2028,2029].map(y=>`<option ${y===yr?'selected':''}>${y}</option>`).join('')}
        </select></div>
    </div>
  </div>
  <div class="card" style="overflow-x:auto">
    <div class="card-title">📅 Histórico — ${FILIAIS[fid]?.label} — ${yr}</div>
    <table class="data-table" style="min-width:800px">
      <thead><tr><th>Funcionário</th>${(yr===2026?MONTHS_ABR.slice(10):MONTHS_ABR).map(m=>`<th style="text-align:center">${m}</th>`).join('')}<th style="background:var(--gn)">TOTAL</th></tr></thead>
      <tbody>${emps.map(e=>{
        let totalAno=0;
        const meses=MONTHS.map((_,i)=>i+1);
        const cells=meses.map((mo_h)=>{ const i=mo_h-1; const _=MONTHS[i];
          const dias=getDias(fid,yr,mo_h,e.id);
          let qtd=0,qtdF=0;
          Object.values(dias).forEach(v=>{const u=(v||'').toUpperCase();if(['X','D','S'].includes(u))qtd++;if(u==='F')qtdF++;});
          const rate=e.rate_d||e.rate_x||e.rate_sdf||0,t=qtd*rate+qtdF*(e.rate_f||0);
          totalAno+=t;
          return `<td style="text-align:center;${t>0?'background:var(--gnb);color:var(--gn);font-weight:700':'color:var(--sub)'}">${t?'R$'+t.toFixed(0):'—'}</td>`;
        }).join('');
        return `<tr><td><strong>${e.nome}</strong><br><small style="color:var(--sub)">${e.funcao}</small></td>${cells}<td style="background:var(--db);color:#fff;font-weight:700;text-align:center">R$ ${totalAno.toFixed(2)}</td></tr>`;
      }).join('')}
      </tbody>
    </table>
  </div>`;
}

function adicionarFilial(){
  const fid = document.getElementById('new-fid')?.value?.trim();
  const label = document.getElementById('new-flabel')?.value?.trim();
  const cor = document.getElementById('new-fcor')?.value||'#2E75B6';

  if(!fid){ showAlert('Digite o código da filial.','error'); return; }
  if(!label){ showAlert('Digite o nome da filial.','error'); return; }
  if(FILIAIS[fid]){ showAlert('Este código já existe nas filiais originais.','error'); return; }
  if(!/^[A-Z0-9_]+$/.test(fid)){ showAlert('Código deve ter apenas letras maiúsculas, números e _.','error'); return; }

  // Save to localStorage
  let customFiliais = {};
  try{ customFiliais = JSON.parse(localStorage.getItem('custom_filiais')||'{}'); }catch(e){}
  customFiliais[fid] = {label, cor};
  localStorage.setItem('custom_filiais', JSON.stringify(customFiliais));

  // Add to FILIAIS runtime
  FILIAIS[fid] = {label, cor};

  // Initialize empty employees
  if(!getFuncsLocal(fid)){
    setFuncsLocal(fid, []);
  }

  showAlert(`✅ Filial "${label}" adicionada!`);
  renderFiliais();
}

function excluirFilial(fid){
  if(!confirm(`Excluir a filial "${FILIAIS[fid]?.label}"?\nOs funcionários cadastrados também serão removidos.`)) return;

  let customFiliais = {};
  try{ customFiliais = JSON.parse(localStorage.getItem('custom_filiais')||'{}'); }catch(e){}
  delete customFiliais[fid];
  localStorage.setItem('custom_filiais', JSON.stringify(customFiliais));
  delete FILIAIS[fid];
  localStorage.removeItem('funcs_'+fid);

  showAlert('Filial excluída.');
  renderFiliais();
}

function carregarFiliaisCustom(){
  try{

    for(const [fid, fcfg] of Object.entries(custom)){
      if(!FILIAIS[fid]) FILIAIS[fid] = fcfg;
    }
  }catch(e){}
}

}

function editarFeriado(idx, campo, valor){
  const cidade = document.getElementById('sel-cidade-fer')?.value || 'FEDERAIS';
  const lista = getFeriadosCidade(cidade);
  if(!lista[idx]) return;
  lista[idx][campo] = campo==='d'||campo==='m' ? +valor : valor;
  salvarFeriadosCidade(cidade, lista);
  showAlert('✅ Feriado atualizado!');
  _holCache = {};
}

function removerFeriado(idx){
  const cidade = document.getElementById('sel-cidade-fer')?.value || 'FEDERAIS';
  const lista = getFeriadosCidade(cidade);
  const nome = lista[idx]?.nome || 'este feriado';
  if(!confirm(`Remover "${nome}"?`)) return;
  lista.splice(idx, 1);
  salvarFeriadosCidade(cidade, lista);
  showAlert(`"${nome}" removido.`);
  renderFeriadosCidade(cidade);
}

function adicionarFeriado(){
  const cidade = document.getElementById('sel-cidade-fer')?.value || 'FEDERAIS';
  const lista = getFeriadosCidade(cidade);
  lista.push({m:1, d:1, nome:'Novo Feriado', tipo:'municipal'});
  salvarFeriadosCidade(cidade, lista);
  renderFeriadosCidade(cidade);
  // Foca no último nome
  const inputs = document.querySelectorAll('#tabela-feriados tbody tr:last-child input[type=text]');
  if(inputs.length) { inputs[0].focus(); inputs[0].select(); }
}

  const cidade = document.getElementById('sel-cidade-fer')?.value || 'FEDERAIS';
  const nome = CIDADE_LABEL[cidade] || cidade;
  if(!confirm(`Restaurar feriados padrão de "${nome}"?\nAlterações feitas aqui serão perdidas.`)) return;
  const custom = getFeriadosCustom() || {};
  delete custom[cidade];

const DADOS_VERSAO = {'BV':'3','BSB':'3','SP_CATARINA':'3','SP_CIDADE_JARDIM':'3','SP_GABRIEL_MONTEIRO':'3','SP_HIGIENOPOLIS':'3','SP_IGT':'3','SP_ITUPEVA':'3','SP_JOAO_CACHOEIRA':'3','SP_VNC':'3','BH_BHB':'3','BH_BHL':'3','BH_BHP':'3','BH_BHS':'3','RJ_RJA':'3','RJ_RJB':'3','RJ_RJG':'3','RJ_RJL':'3','RJ_RJV':'3','RJ_RJI':'3'};

function _normNome(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s+/g,' ').trim();}
function _copiarContatos(dest,orig){
  if(!Array.isArray(orig)) return dest;
  return dest.map(e=>{const o=orig.find(x=>x.id===e.id)||orig.find(x=>_normNome(x.nome)===_normNome(e.nome));
    if(!o) return e; const n={...e}; ['cpf','tel','email'].forEach(k=>{if(!n[k]&&o[k]) n[k]=String(o[k]);}); return n;});
}
// Ao trocar a versão da lista, leva CPF/e-mail/telefone que já estavam neste navegador
;(function migrarCadastro(){
  try{ Object.keys(DADOS_VERSAO).forEach(fid=>{
    if(localStorage.getItem('funcs_versao_'+fid)===DADOS_VERSAO[fid]) return;
    let antigo=null; try{antigo=JSON.parse(localStorage.getItem('funcs_'+fid)||'null');}catch(e){}
    const novo=_copiarContatos(JSON.parse(JSON.stringify(FUNCIONARIOS[fid]||[])),antigo);
    localStorage.setItem('funcs_'+fid,JSON.stringify(novo));
    localStorage.setItem('funcs_versao_'+fid,DADOS_VERSAO[fid]);
  }); }catch(e){}
})();
// Busca o cadastro da planilha (com CPF/e-mail/telefone)
async function _funcsServidor(fid){
  if(!temSync()) return null;
  try{const r=await fetch(`${SCRIPT_URL}?action=get_funcs&fid=${fid}`);const j=await r.json();
    return (j&&j.ok&&Array.isArray(j.funcs))?j.funcs:null;}catch(e){return null;}
}
function getFuncsLocal(fid){
  try{
    const versaoEsperada = DADOS_VERSAO[fid]||'1';
    const versao = localStorage.getItem('funcs_versao_'+fid);
    if(versao !== versaoEsperada) return null;
    const raw = localStorage.getItem('funcs_'+fid);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return null;
}
function setFuncsLocal(fid,emps){
  try{
    localStorage.setItem('funcs_'+fid, JSON.stringify(emps));
    localStorage.setItem('funcs_versao_'+fid, DADOS_VERSAO[fid]||'1');
  }catch(e){}
  // Sincroniza com Google Sheets (completa contatos vazios com os da planilha, para não apagá-los)
  if(temSync()){
    _funcsServidor(fid).then(srv=>{
      const lista=_copiarContatos(emps,srv);
      if(srv){ try{localStorage.setItem('funcs_'+fid,JSON.stringify(lista));}catch(e){} }
      return fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({action:'salvar_funcs',fid,funcs:lista})});
    }).then(r=>r.json()).then(j=>{
      if(j.ok) syncStatus('👥 Funcionários salvos '+new Date().toLocaleTimeString('pt-BR'),'#90EE90');
    }).catch(()=>{});
  }
}

// Carrega funcionários do Google Sheets
async function carregarFuncsServidor(fid){
  if(!temSync()) return false;
  try{
    const r = await fetch(`${SCRIPT_URL}?action=get_funcs&fid=${fid}`);
    const j = await r.json();
    if(j.ok && j.funcs && j.funcs.length){
      localStorage.setItem('funcs_'+fid, JSON.stringify(j.funcs));
      localStorage.setItem('funcs_versao_'+fid, DADOS_VERSAO[fid]||'1');
      return true;
    }
  }catch(e){}
  return false;
}
function getFuncs(fid){
  return getFuncsLocal(fid) || FUNCIONARIOS[fid] || [];
}
// Retorna só funcionários ativos para um mês/ano específico
function getFuncsAtivos(fid, yr, mo){
  const emps = getFuncs(fid);
  // Data do último dia do mês
  const fimMes = new Date(yr, mo, 0).toISOString().split('T')[0];
  // Primeiro dia do mês
  const iniMes = `${yr}-${String(mo).padStart(2,'0')}-01`;
  return emps.filter(e=>{
    // Sem admissão ou admissão antes do fim do mês
    const admOk = !e.admissao || e.admissao <= fimMes;
    // Sem demissão ou demissão no/após o início do mês
    const demOk = !e.demissao || e.demissao >= iniMes;
    return admOk && demOk;
  });
}

    rj_estoquista:  {d:'💡 Estoquista/Caixa RJ: X = dia (valor normal) | S+D+F = mesmo valor diferenciado',lbl:'R$ por S / D / F',hint:'X=dia normal | S/D/F=mesmo valor diferente do dia'},
  };
  const info=dicas[tipo]||dicas.vendedora;
  if(dica) dica.innerHTML=info.d;
  if(lblD) lblD.textContent=info.lbl;
  if(hintD) hintD.textContent=info.hint;
}

function salvarFunc(fid, idx){
  const nome=document.getElementById('fn-nome').value.trim();
  if(!nome){showAlert('Nome é obrigatório.','error');return;}
  const tipo=document.getElementById('fn-tipo').value;
  const rateD=parseFloat(document.getElementById('fn-rate-d').value)||0;
  const rateF=parseFloat(document.getElementById('fn-rate-f').value)||0;
  const emps=getFuncs(fid).slice();
  const empAtual = idx!==null ? emps[idx] : null;

  // Vigência do novo valor (só para edição)
  const vigMo = parseInt(document.getElementById('fn-vig-mo')?.value)||null;
  const vigYr = parseInt(document.getElementById('fn-vig-yr')?.value)||null;

  // Detecta se os valores mudaram
  const oldRateD = empAtual ? (empAtual.rate_d||empAtual.rate_x||empAtual.rate_sdf||0) : 0;
  const oldRateF = empAtual ? (empAtual.rate_f||0) : 0;
  const ratesChanged = empAtual && (oldRateD!==rateD || oldRateF!==rateF);

  const novoEmp={
    id: idx!==null ? emps[idx].id : (fid.toLowerCase()+'_'+Date.now()),
    nome: nome,
    funcao: document.getElementById('fn-funcao').value.trim()||'',
    tipo: tipo,
    rate_d: rateD,
    rate_x: ['mensalista','estoquista','rj_staff','misto','estoquista_loja','rj_estoquista'].includes(tipo) ? (parseFloat(document.getElementById('fn-rate-x')?.value)||0) : 0,
    rate_sdf: ['rj_vendedora','rj_staff','rj_estoquista'].includes(tipo) ? rateD : 0,
    rate_f: ['rj_vendedora','rj_estoquista','rj_staff'].includes(tipo) ? rateD : rateF,
    rate_fixo: parseFloat(document.getElementById('fn-rate-fixo')?.value)||0,
    cpf:      document.getElementById('fn-cpf').value.trim(),
    tel:      document.getElementById('fn-tel').value.trim(),
    email:    document.getElementById('fn-email').value.trim(),
    admissao:      document.getElementById('fn-admissao')?.value||'',
    demissao:      document.getElementById('fn-demissao')?.value||'',
    ativo:         !document.getElementById('fn-demissao')?.value,
    aft_ini:       document.getElementById('fn-aft-ini')?.value||'',
    aft_fim:       document.getElementById('fn-aft-fim')?.value||'',
    func_anterior: document.getElementById('fn-func-ant')?.value||'',
    func_data:     document.getElementById('fn-func-dt')?.value||'',
  };

  // Preserva histórico de taxas anteriores
  if(ratesChanged && vigYr && vigMo){
    const hist = empAtual.rate_historico || [];
    // Adiciona entrada antiga se não existir ainda
    hist.push({
      de_yr: hist.length===0 ? 2026 : (empAtual.rate_vig_yr||2026),
      de_mo: hist.length===0 ? 11   : (empAtual.rate_vig_mo||11),
      ate_yr: vigYr,
      ate_mo: vigMo,
      rate_d: oldRateD,
      rate_f: oldRateF,
    });
    novoEmp.rate_historico = hist;
    novoEmp.rate_vig_yr = vigYr;
    novoEmp.rate_vig_mo = vigMo;
  } else if(empAtual){
    // Preserva histórico existente
    novoEmp.rate_historico = empAtual.rate_historico || [];
    novoEmp.rate_vig_yr = empAtual.rate_vig_yr;
    novoEmp.rate_vig_mo = empAtual.rate_vig_mo;
  }

  // Verifica transferência
  const paraFid = document.getElementById('fn-transferir-para')?.value;
  const paraData = document.getElementById('fn-transferir-data')?.value||'';

  if(idx!==null && paraFid && paraFid !== fid && !paraData){ showAlert('Informe a data da transferência.','error'); return; }
  if(idx!==null && paraFid && paraFid !== fid){
    // Remove da filial atual
    const empsAtual = getFuncs(fid).filter((_,i)=>i!==idx);
    setFuncsLocal(fid, empsAtual);
    // Adiciona na filial destino com novo ID e data de admissão atualizada
    const empDestino = {...novoEmp,
      id: paraFid.toLowerCase()+'_'+Date.now(),
      admissao: paraData||novoEmp.admissao,
      ordem: getFuncs(paraFid).length+1
    };
    const empsDestino = getFuncs(paraFid).slice();
    empsDestino.push(empDestino);
    setFuncsLocal(paraFid, empsDestino);
    document.getElementById('_modal_func')?.remove();
    showAlert(`✅ ${novoEmp.nome} transferido para ${FILIAIS[paraFid]?.label}!`);
    renderListaFuncs();
    return;
  }

  if(idx!==null) emps[idx]=novoEmp;
  else emps.push(novoEmp);
  setFuncsLocal(fid,emps);
  document.getElementById('_modal_func')?.remove();

  if(ratesChanged && vigYr && vigMo){
    showAlert(`✅ Valores atualizados a partir de ${MONTHS[vigMo-1]}/${vigYr}. Histórico anterior preservado.`);
  } else {
    showAlert(idx!==null?'Funcionário atualizado!':'Funcionário adicionado!');
  }
  renderListaFuncs();
}

function excluirFunc(idx){

Os dados de escala preenchidos para ele serão mantidos.`)) return;

function buildMesOptions(selectedMo, yr){
  return MONTHS.map((m,i)=>{
    if(yr===2026 && (i+1)<11) return '';
    return `<option value="${i+1}" ${i+1===selectedMo?'selected':''}>${m}</option>`;
  }).join('');
}

  if(el) el.innerHTML=buildMesOptions(mo,yr);
}

// SINCRONIZAÇÃO COM GOOGLE SHEETS (TEMPO REAL)
// ══════════════════════════════════════════════════════════════════
let _syncInterval = null;
let _lastSync = null;
let _syncAtivo = false;

function temSync(){ return !!SCRIPT_URL; }

async function sincronizarTodasLojas(){
  if(!temSync()){ showAlert('Configure o Tempo Real primeiro.','error'); return; }
  const btn=document.getElementById('btn-sync-all');

// ── SALVAMENTO SEGURO ─────────────────────────────────────────────
// Antes de enviar, lê a planilha e só substitui os funcionários que foram
// alterados NESTE navegador. Os demais ficam como estão na planilha, então
// um navegador desatualizado não apaga mais o trabalho de outro.
let _pend=(()=>{try{return JSON.parse(localStorage.getItem('escalas_pendentes')||'{}');}catch(e){return {};}})();
function _salvarPend(){try{localStorage.setItem('escalas_pendentes',JSON.stringify(_pend));}catch(e){}}
function _temDias(d){return !!(d&&d.dias&&Object.keys(d.dias).length);}
function marcarPendente(fid,yr,mo,empId){const g=`${fid}__${yr}__${mo}`;_pend[g]=_pend[g]||{};_pend[g][empId]=(+_pend[g][empId]||0)+1;_salvarPend();}
const _enviando={};
const _envTimers={};
function agendarEnvio(fid,yr,mo,ms){
  if(!temSync()) return;
  const g=`${fid}__${yr}__${mo}`;
  clearTimeout(_envTimers[g]);
  atualizarStatusSync('💾 Salvando…');
  _envTimers[g]=setTimeout(()=>enviarSeguro(fid,yr,mo),ms||1500);
}
async function enviarSeguro(fid, yr, mo){
  if(!temSync()) return false;
  const g=`${fid}__${yr}__${mo}`;
  if(_enviando[g]){ agendarEnvio(fid,yr,mo,2000); return false; }   // um envio por vez
  _enviando[g]=true;
  const snap=Object.assign({},_pend[g]||{});                       // o que estava pendente ao começar
  const alterados=Object.keys(snap);
  try{
    const r=await fetch(`${SCRIPT_URL}?action=ler&fid=${fid}&yr=${yr}&mo=${mo}`);
    const j=await r.json();
    if(!j||!j.ok) throw new Error('não consegui ler a planilha');
    const srv={}; (j.dados||[]).forEach(e=>{srv[e.empId]=e;});
    const ids=new Set(getFuncs(fid).map(e=>e.id));
    Object.keys(srv).forEach(id=>ids.add(id));        // nunca remove linhas da planilha
    const dados=[];
    for(const id of ids){
      const k=chave(fid,yr,mo,id), loc=escalaLocal[k], s=srv[id];
      let use;
      if(alterados.includes(id)) use=loc||{dias:{}};   // alterado aqui: vale o deste navegador
      else if(_temDias(s)){                              // não alterado: vale a planilha
        use=s; escalaLocal[k]={dias:s.dias,qtd:s.qtd||0,qtdF:s.qtdF||0,total:s.total||0};
      }
      else use=_temDias(loc)?loc:(s||{dias:{}});         // planilha vazia: não perde o local
      dados.push({empId:id,dias:use.dias||{},qtd:use.qtd||0,qtdF:use.qtdF||0,total:use.total||0});
    }
    const resp=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({action:'salvar',fid,yr,mo,dados})});
    const jr=await resp.json().catch(()=>({}));
    if(jr&&jr.ok===false) throw new Error(jr.erro||jr.error||'planilha recusou');
    // Só limpa o pendente de quem NÃO foi alterado de novo durante o envio
    if(_pend[g]){ for(const id of alterados){ if(_pend[g][id]===snap[id]) delete _pend[g][id]; }
      if(!Object.keys(_pend[g]).length) delete _pend[g]; }
    _salvarPend(); salvarLocal();
    _enviando[g]=false;
    if(_pend[g]) agendarEnvio(fid,yr,mo,500);                       // houve alteração no meio: envia de novo
    _lastSync=new Date();
    atualizarStatusSync('✅ Salvo na planilha '+_lastSync.toLocaleTimeString('pt-BR'));
    return true;
  }catch(err){
    _enviando[g]=false;
    atualizarStatusSync('⚠️ Ainda não salvou na planilha — nova tentativa em 30s');
    agendarEnvio(fid,yr,mo,30000);
    return false;
  }
}
async function sincronizarSalvar(fid, yr, mo){ return enviarSeguro(fid, yr, mo); }

async function sincronizarCarregar(fid, yr, mo){
  if(!temSync()) return false;
  try{
    const url = `${SCRIPT_URL}?action=ler&fid=${fid}&yr=${yr}&mo=${mo}`;
    const resp = await fetch(url);
    const json = await resp.json();
    if(json.ok && json.dados){
      const g=`${fid}__${yr}__${mo}`; let reenviar=false;
      for(const emp of json.dados){
        const k = chave(fid,yr,mo,emp.empId);
        // Alteração deste navegador ainda não enviada: mantém a local
        if(_pend[g] && _pend[g][emp.empId]){ reenviar=true; continue; }
        // Planilha vazia mas navegador tem escala: mantém e envia, em vez de apagar
        if(!_temDias(emp) && _temDias(escalaLocal[k])){ marcarPendente(fid,yr,mo,emp.empId); reenviar=true; continue; }
        const empData = getFuncs(fid).find(e=>e.id===emp.empId);
        // Corrige D→X só para mensalistas (que não têm a opção Domingo).
        // Estoquista de loja TEM domingo (D) com valor próprio: não converter.
        const dias = emp.dias||{};
        if(empData && empData.tipo==='mensalista'){
          Object.keys(dias).forEach(d=>{ if(dias[d]==='D') dias[d]='X'; });
        }
        // Recalcula total com rates atuais
        let total = emp.total||0;
        if(empData){
          const rates = getRates(empData,yr,mo);
          const calc = calcTotal(dias,rates);
          total = calc.total;
        }
        escalaLocal[k] = { dias, qtd:emp.qtd||0, qtdF:emp.qtdF||0, total };
      }
      salvarLocal();
      if(reenviar) agendarEnvio(fid,yr,mo);
      _lastSync = new Date();
      atualizarStatusSync('🔄 Atualizado ' + _lastSync.toLocaleTimeString('pt-BR'));
      return true;
    }
  }catch(err){}
  return false;
}

function iniciarAutoSync(fid, yr, mo){
  pararAutoSync();
  if(!temSync()) return;
  _syncAtivo = true;
  // Atualiza a cada 30 segundos
  _syncInterval = setInterval(async ()=>{
    if(!_syncAtivo) return;
    const ok = await sincronizarCarregar(fid, yr, mo);
    if(ok) renderGrade();
  }, 30000);
}

function pararAutoSync(){
  _syncAtivo = false;
  if(_syncInterval){ clearInterval(_syncInterval); _syncInterval=null; }
}

function atualizarStatusSync(msg){
  let el = document.getElementById('_sync_status');
  if(el) el.textContent = msg;
}

async function testarSync(){
  const url = document.getElementById('sync-url')?.value?.trim();
  if(!url){ showAlert('Cole a URL primeiro.','error'); return; }
  showAlert('Testando conexão…','info');
  try{
    const resp = await fetch(url+'?action=ping');
    const json = await resp.json();
    if(json.ok) showAlert('✅ Conexão OK! '+json.msg);
    else showAlert('⚠️ Resposta inesperada: '+JSON.stringify(json),'error');
  }catch(err){
    showAlert('❌ Erro: '+err.message+' — Verifique se a URL está correta e se o acesso é "Qualquer pessoa".','error');
  }
}

function salvarConfigSync(){
  const url = document.getElementById('sync-url')?.value?.trim();
  if(!url){ showAlert('Cole a URL do Apps Script.','error'); return; }
  SCRIPT_URL = url;
  localStorage.setItem('trousseau_script_url', url);
  document.getElementById('_modal_sync')?.remove();
  showAlert('✅ Sincronização ativada! Os dados serão salvos no Google Sheets automaticamente.');
  // Atualiza o botão de sync no header
  const btn = document.getElementById('btn-sync');
  if(btn){ btn.textContent='🔄 Sincronizado'; btn.style.background='rgba(55,86,35,.4)'; }
}
